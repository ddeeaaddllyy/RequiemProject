name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Use a version tag such as v2.0.0 or v2.1.0-beta.1'
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  publish:
    name: Sign and publish release
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CODE: ${{ needs.prepare.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build release APK and bundle
        run: |
          bash ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --max-workers=2 \
            "-PversionName=$RELEASE_VERSION" "-PversionCode=$RELEASE_CODE"
      - name: Sign release files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing signing secret: $variable (see .github/RELEASE.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "dist/Requiem-$RELEASE_TAG.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "dist/Requiem-$RELEASE_TAG.apk"
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -signedjar "dist/Requiem-$RELEASE_TAG.aab" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify "dist/Requiem-$RELEASE_TAG.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: requiem-release-${{ needs.prepare.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --target "$RELEASE_COMMIT" \
              --title "Requiem $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
